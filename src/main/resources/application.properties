spring.application.name=exchangeRate
application.version=${version}
spring.config.import=optional:file:./private.properties
spring.http.serviceclient.exchange-rate-api.base-url=https://v6.exchangerate-api.com
spring.http.serviceclient.exchange-rate-api.connect-timeout=2s
spring.http.serviceclient.exchange-rate-api.read-timeout=5s
exchangeCheckCron=0 0 9-21 * * *
cronTimeZone=GMT+04:00

logging.file.name=logs/application.log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

spring.session.store-type=none

spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

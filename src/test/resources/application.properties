spring.datasource.url=jdbc:h2:mem:exchangeRate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true

spring.application.name=exchangeRate-test
application.version=test
exchangeApiURLTemplate=https://example.test/rates/%s/%s/%s
exchangeCheckCron=0 0 9-21 * * *
cronTimeZone=GMT+04:00

exchangeApiKey=test-exchange-api-key
telegramToken=test-telegram-token
jwt.secret=test-jwt-secret-that-is-long-enough-for-hs512-signing-key
jwt.expiration=3600
admin.username=test-admin
admin.password=test-admin-password

spring.session.store-type=none

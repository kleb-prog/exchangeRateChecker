plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
	id 'com.github.node-gradle.node' version '7.0.2'
}

group = 'com.lebedev'
version = '0.0.6-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-gson:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
	implementation group: 'org.telegram', name: 'telegrambots-client', version: '7.2.1'
	implementation group: 'org.telegram', name: 'telegrambots-springboot-longpolling-starter', version: '7.2.1'
	implementation group: 'redis.clients', name: 'jedis', version: '5.1.3'
	implementation 'org.postgresql:postgresql:42.7.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

node {
	download = false
	nodeProjectDir = file("${project.projectDir}/frontend")
}

tasks.register('buildReact', NpmTask) {
	dependsOn npmInstall
	workingDir = file("${project.projectDir}/frontend")
	args = ['run', 'build']
}

tasks.register('copyReactBuild', Copy) {
	dependsOn buildReact
	mustRunAfter resolveMainClassName, compileTestJava, jar, test
	from "${project.projectDir}/frontend/build"
	into "${project.layout.buildDirectory.get()}/resources/main/static"
}

processResources {
	expand project.properties
}

bootJar {
	dependsOn copyReactBuild
}

tasks.named('test') {
	useJUnitPlatform()
}
